apiVersion: apps/v1
kind: Deployment
metadata:
  name: workmaite-backend
  namespace: skala3-finalproj-class2-team9
  labels:
    app: workmaite-backend
spec:
  replicas: 1  # 실행할 Pod 개수
  selector:
    matchLabels:
      app: workmaite-backend  # 아래 template labels와 반드시 일치해야 함
  template:
    metadata:
      labels:
        app: workmaite-backend
    spec:
      imagePullSecrets:
        - name: harbor-secret  # Harbor 인증 정보 (교육환경에서 네임스페이스에 미리 등록됨)
      containers:
        - name: workmaite-backend
          # GitHub Actions에서 커밋 SHA로 태그를 동적으로 업데이트함
          image: amdp-registry.skala-ai.com/skala26a-ai2/workmaite-backend:latest
          imagePullPolicy: Always  # 같은 태그라도 항상 최신 이미지 pull
          ports:
            - containerPort: 8080  # Spring Boot 기본 포트
          # readinessProbe: 트래픽 받을 준비됐는지 확인 (실패 시 트래픽 차단)
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 8080
            initialDelaySeconds: 10  # Spring Boot는 JVM 로딩으로 AI보다 느림
            periodSeconds: 10
          # livenessProbe: Pod가 살아있는지 확인 (실패 시 Pod 재시작)
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 8080
            initialDelaySeconds: 20  # readinessProbe보다 늦게 시작
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: workmaite-backend
  namespace: skala3-finalproj-class2-team9
  labels:
    app: workmaite-backend
spec:
  type: ClusterIP  # 클러스터 내부에서만 접근 가능, 외부 노출은 Ingress가 담당
  selector:
    app: workmaite-backend  # 이 label을 가진 Pod로 트래픽 전달
  ports:
    - name: http
      port: 8080        # Service가 받는 포트
      targetPort: 8080  # 실제 Pod의 포트 (containerPort와 일치)