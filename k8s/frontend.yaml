apiVersion: apps/v1
kind: Deployment
metadata:
  name: workmaite-frontend
  namespace: skala3-finalproj-class2-team9
  labels:
    app: workmaite-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: workmaite-frontend
  template:
    metadata:
      labels:
        app: workmaite-frontend
    spec:
      imagePullSecrets:
        - name: harbor-secret
      containers:
        - name: workmaite-frontend
          image: amdp-registry.skala-ai.com/skala26a-ai2/workmaite-frontend:cicd-pipeline
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: workmaite-frontend
  namespace: skala3-finalproj-class2-team9
  labels:
    app: workmaite-frontend
spec:
  type: ClusterIP
  selector:
    app: workmaite-frontend
  ports:
    - name: http
      port: 80
      targetPort: 80
