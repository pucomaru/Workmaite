# 실제 값은 git에 커밋하지 말 것 — 클러스터에 직접 생성:
#   kubectl create secret generic neo4j-secret -n skala3-finalproj-class2-team9 \
#     --from-literal=NEO4J_AUTH="neo4j/<새-비밀번호>"
# (기존 비밀번호는 git 히스토리에 노출되었으므로 반드시 교체 — SECURITY_ROTATION.md 참조)
apiVersion: v1
kind: Secret
metadata:
  name: neo4j-secret
  namespace: skala3-finalproj-class2-team9
type: Opaque
stringData:
  NEO4J_AUTH: "neo4j/yourpassword"
