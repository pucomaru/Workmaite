apiVersion: v1
kind: ConfigMap
metadata:
  name: neo4j-scripts
  namespace: skala3-finalproj-class2-team9
data:
  init.cypher: |
    // =============================================================
    // init.cypher  —  Schema Constraints & Indexes
    // PostgreSQL Source of Truth → Neo4j 동기화 노드 기반
    // 노드: User / Department / Meetings / Session / Agenda /
    //       Minutes / MinutesChunk / Report / ReportChunk / HumanJudgment
    // =============================================================

    // ── Uniqueness Constraints ────────────────────────────────────

    // User (PG users)
    CREATE CONSTRAINT user_pg_id IF NOT EXISTS
      FOR (n:User) REQUIRE n.pg_id IS UNIQUE;
    CREATE CONSTRAINT user_email IF NOT EXISTS
      FOR (n:User) REQUIRE n.email IS UNIQUE;

    // Department (파생 노드 — name이 PK)
    CREATE CONSTRAINT department_name IF NOT EXISTS
      FOR (n:Department) REQUIRE n.name IS UNIQUE;

    // Company (파생 노드 — name이 PK)
    CREATE CONSTRAINT company_name IF NOT EXISTS
      FOR (n:Company) REQUIRE n.name IS UNIQUE;

    // Meetings (PG meetings)
    CREATE CONSTRAINT meetings_id IF NOT EXISTS
      FOR (n:Meetings) REQUIRE n.id IS UNIQUE;

    // Session (PG meeting_sessions)
    CREATE CONSTRAINT session_id IF NOT EXISTS
      FOR (n:Session) REQUIRE n.id IS UNIQUE;

    // Agenda (PG agenda)
    CREATE CONSTRAINT agenda_id IF NOT EXISTS
      FOR (n:Agenda) REQUIRE n.id IS UNIQUE;

    // Minutes (PG minutes)
    CREATE CONSTRAINT minutes_pg_id IF NOT EXISTS
      FOR (n:Minutes) REQUIRE n.pg_id IS UNIQUE;

    // MinutesChunk (file_embedder — minutes 파일 청킹)
    CREATE CONSTRAINT minuteschunk_id IF NOT EXISTS
      FOR (n:MinutesChunk) REQUIRE n.id IS UNIQUE;

    // Report (PG reports)
    CREATE CONSTRAINT report_id IF NOT EXISTS
      FOR (n:Report) REQUIRE n.id IS UNIQUE;

    // ReportChunk (file_embedder — report 파일 청킹 + AI 리뷰 저장)
    CREATE CONSTRAINT reportchunk_id IF NOT EXISTS
      FOR (n:ReportChunk) REQUIRE n.id IS UNIQUE;

    // HumanJudgment (PG hitl_reviews)
    CREATE CONSTRAINT humanjudgment_id IF NOT EXISTS
      FOR (n:HumanJudgment) REQUIRE n.id IS UNIQUE;


    // ── Lookup Indexes ────────────────────────────────────────────

    CREATE INDEX user_name              IF NOT EXISTS FOR (n:User)          ON (n.name);
    CREATE INDEX user_department        IF NOT EXISTS FOR (n:User)          ON (n.department);
    CREATE INDEX meetings_status        IF NOT EXISTS FOR (n:Meetings)      ON (n.status);
    CREATE INDEX meetings_type          IF NOT EXISTS FOR (n:Meetings)      ON (n.type);
    CREATE INDEX session_status         IF NOT EXISTS FOR (n:Session)       ON (n.status);
    CREATE INDEX session_scheduled_at   IF NOT EXISTS FOR (n:Session)       ON (n.scheduled_at);
    CREATE INDEX agenda_status          IF NOT EXISTS FOR (n:Agenda)        ON (n.status);
    CREATE INDEX agenda_priority        IF NOT EXISTS FOR (n:Agenda)        ON (n.priority);
    CREATE INDEX agenda_due_date        IF NOT EXISTS FOR (n:Agenda)        ON (n.due_date);
    CREATE INDEX report_human_status    IF NOT EXISTS FOR (n:Report)        ON (n.human_status);
    CREATE INDEX report_created_at      IF NOT EXISTS FOR (n:Report)        ON (n.created_at);
    CREATE INDEX humanjudgment_judged   IF NOT EXISTS FOR (n:HumanJudgment) ON (n.judged_at);
    CREATE INDEX humanjudgment_target   IF NOT EXISTS FOR (n:HumanJudgment) ON (n.target_type);


    // ── Vector Indexes (임베딩 유사도 검색) ───────────────────────

    CREATE VECTOR INDEX meetingsEmbedding IF NOT EXISTS
      FOR (n:Meetings) ON (n.embedding)
      OPTIONS {indexConfig: {`vector.dimensions`: 1536, `vector.similarity_function`: 'cosine'}};

    CREATE VECTOR INDEX agendaEmbedding IF NOT EXISTS
      FOR (n:Agenda) ON (n.embedding)
      OPTIONS {indexConfig: {`vector.dimensions`: 1536, `vector.similarity_function`: 'cosine'}};

    CREATE VECTOR INDEX sessionEmbedding IF NOT EXISTS
      FOR (n:Session) ON (n.embedding)
      OPTIONS {indexConfig: {`vector.dimensions`: 1536, `vector.similarity_function`: 'cosine'}};

    CREATE VECTOR INDEX minutesEmbedding IF NOT EXISTS
      FOR (n:Minutes) ON (n.embedding)
      OPTIONS {indexConfig: {`vector.dimensions`: 1536, `vector.similarity_function`: 'cosine'}};

    CREATE VECTOR INDEX minutesChunkEmbedding IF NOT EXISTS
      FOR (n:MinutesChunk) ON (n.embedding)
      OPTIONS {indexConfig: {`vector.dimensions`: 1536, `vector.similarity_function`: 'cosine'}};

    CREATE VECTOR INDEX reportEmbedding IF NOT EXISTS
      FOR (n:Report) ON (n.embedding)
      OPTIONS {indexConfig: {`vector.dimensions`: 1536, `vector.similarity_function`: 'cosine'}};

    CREATE VECTOR INDEX reportChunkEmbedding IF NOT EXISTS
      FOR (n:ReportChunk) ON (n.embedding)
      OPTIONS {indexConfig: {`vector.dimensions`: 1536, `vector.similarity_function`: 'cosine'}};

    CREATE VECTOR INDEX humanJudgmentEmbedding IF NOT EXISTS
      FOR (n:HumanJudgment) ON (n.embedding)
      OPTIONS {indexConfig: {`vector.dimensions`: 1536, `vector.similarity_function`: 'cosine'}};

    CREATE CONSTRAINT user_pg_id    IF NOT EXISTS FOR (u:User)          REQUIRE u.pg_id IS UNIQUE;
    CREATE CONSTRAINT meetings_id   IF NOT EXISTS FOR (m:Meetings)      REQUIRE m.id    IS UNIQUE;
    CREATE CONSTRAINT session_id    IF NOT EXISTS FOR (s:Session)       REQUIRE s.id    IS UNIQUE;
    CREATE CONSTRAINT agenda_id     IF NOT EXISTS FOR (a:Agenda)        REQUIRE a.id    IS UNIQUE;
    CREATE CONSTRAINT minutes_id    IF NOT EXISTS FOR (m:Minutes)       REQUIRE m.id    IS UNIQUE;
    CREATE CONSTRAINT report_id     IF NOT EXISTS FOR (r:Report)        REQUIRE r.id    IS UNIQUE;
    CREATE CONSTRAINT dept_name     IF NOT EXISTS FOR (d:Department)    REQUIRE d.name  IS UNIQUE;
    CREATE CONSTRAINT company_name  IF NOT EXISTS FOR (c:Company)       REQUIRE c.name  IS UNIQUE;

  entrypoint.sh: |
    #!/bin/bash
    # NEO4J_AUTH 환경변수(neo4j/password 형식)에서 비밀번호 추출
    NEO4J_PASSWORD="${NEO4J_AUTH#*/}"

    /startup/docker-entrypoint.sh neo4j &
    NEO4J_PID=$!

    echo "Waiting for Neo4j to be ready..."
    until cypher-shell -u neo4j -p "${NEO4J_PASSWORD}" \
          "RETURN 1" > /dev/null 2>&1; do
      sleep 3
    done

    INIT_FLAG="/data/import/.init_done"
    if [ ! -f "$INIT_FLAG" ]; then
      echo "Running init.cypher..."
      cypher-shell -u neo4j -p "${NEO4J_PASSWORD}" \
        --file /var/lib/neo4j/import/init.cypher
      touch "$INIT_FLAG"
      echo "init.cypher done."
    else
      echo "init.cypher already applied, skipping."
    fi

    wait $NEO4J_PID
