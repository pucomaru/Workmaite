# P5-4: PostgreSQL 일일 백업 → R2 (pg_dump custom 포맷)
# 매일 KST 03:00 (UTC 18:00). 복구: aws s3 cp로 내려받아 pg_restore -d <db> <file>
apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-backup
  namespace: skala3-finalproj-class2-team9
spec:
  schedule: "0 18 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          restartPolicy: Never
          volumes:
            - name: backup
              emptyDir: {}
          initContainers:
            - name: pg-dump
              image: postgres:15-alpine
              command: ["/bin/sh", "-c"]
              args:
                - pg_dump -h postgres-1-postgresql.postgres.svc.cluster.local -U team9
                  -d sk-team-9 -F c -f /backup/sk-team-9_$(date +%Y%m%d).dump
                  && ls -lh /backup
              env:
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: backend-secret
                      key: DB_PASSWORD
              volumeMounts:
                - name: backup
                  mountPath: /backup
          containers:
            - name: upload-r2
              image: amazon/aws-cli:2.17.0
              command: ["/bin/sh", "-c"]
              args:
                - aws s3 cp /backup/ "s3://workmaite-bucket/backups/postgres/"
                  --recursive --endpoint-url "$R2_ENDPOINT"
              env:
                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: r2-secret
                      key: R2_ACCESS_KEY_ID
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: r2-secret
                      key: R2_SECRET_ACCESS_KEY
                - name: R2_ENDPOINT
                  valueFrom:
                    secretKeyRef:
                      name: r2-secret
                      key: R2_ENDPOINT
              volumeMounts:
                - name: backup
                  mountPath: /backup
