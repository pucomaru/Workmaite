apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: workmaite-ingress
  namespace: skala3-finalproj-class2-team9
  labels:
    app: workmaite
spec:
  ingressClassName: public-nginx
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: workmaite-backend
                port:
                  number: 8080
          - path: /ai
            pathType: Prefix
            backend:
              service:
                name: workmaite-ai-agent
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: workmaite-frontend
                port:
                  number: 80
