# # ──────────────────────────────────────────────────────────────────────────
# # k8s Secret 생성 템플릿 — 실제 값을 채운 사본을 git에 커밋하지 말 것
# # 적용: 값 채운 뒤  kubectl apply -f <복사본>  또는 아래 kubectl create 명령 사용
# # 배포 yaml(backend.yaml 등)이 이 Secret들을 secretKeyRef로 참조한다.
# # ──────────────────────────────────────────────────────────────────────────
# apiVersion: v1
# kind: Secret
# metadata:
#   name: backend-secret
#   namespace: skala3-finalproj-class2-team9
# type: Opaque
# stringData:
#   DB_PASSWORD: ""
#   JWT_SECRET: ""
# ---
# apiVersion: v1
# kind: Secret
# metadata:
#   name: postgres-secret
#   namespace: skala3-finalproj-class2-team9
# type: Opaque
# stringData:
#   POSTGRES_PASSWORD: ""
# # ──────────────────────────────────────────────────────────────────────────
# # CLI로 직접 생성하는 경우:
# #   kubectl create secret generic backend-secret -n skala3-finalproj-class2-team9 \
# #     --from-literal=DB_PASSWORD='...' \
# #     --from-literal=JWT_SECRET="$(openssl rand -base64 48)"
# #
# # 주의: JWT_SECRET은 FastAPI(ai-secret의 JWT_SECRET)와 반드시 동일해야 한다 (공유 JWT 검증).
# # ai-secret / r2-secret / harbor-secret은 기존에 클러스터에 존재
# # ──────────────────────────────────────────────────────────────────────────
