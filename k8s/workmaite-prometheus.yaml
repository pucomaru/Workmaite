apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: workmaite-prometheus-data
  namespace: skala3-finalproj-class2-team9
  labels:
    app: workmaite-prometheus
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: workmaite-prometheus-config
  namespace: skala3-finalproj-class2-team9
  labels:
    app: workmaite-prometheus
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    scrape_configs:
      - job_name: 'workmaite-backend'
        metrics_path: /actuator/prometheus
        static_configs:
          - targets: ['workmaite-backend:8080']
            labels:
              service: workmaite-backend

      - job_name: 'workmaite-ai'
        metrics_path: /metrics
        static_configs:
          - targets: ['workmaite-ai:8000']
            labels:
              service: workmaite-ai

      - job_name: 'workmaite-neo4j'
        metrics_path: /metrics
        static_configs:
          - targets: ['workmaite-neo4j:2004']
            labels:
              service: workmaite-neo4j

      - job_name: 'workmaite-whisper'
        metrics_path: /metrics
        static_configs:
          - targets: ['workmaite-whisper:8000']
            labels:
              service: workmaite-whisper

      - job_name: 'workmaite-wlk'
        metrics_path: /metrics
        static_configs:
          - targets: ['workmaite-wlk:8000']
            labels:
              service: workmaite-wlk
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: workmaite-prometheus
  namespace: skala3-finalproj-class2-team9
  labels:
    app: workmaite-prometheus
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: workmaite-prometheus
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: workmaite-prometheus
    spec:
      securityContext:
        fsGroup: 65534
      containers:
        - name: prometheus
          image: prom/prometheus:v2.55.1
          imagePullPolicy: IfNotPresent
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=24h
          ports:
            - name: http
              containerPort: 9090
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
              readOnly: true
            - name: data
              mountPath: /prometheus
      volumes:
        - name: config
          configMap:
            name: workmaite-prometheus-config
        - name: data
          persistentVolumeClaim:
            claimName: workmaite-prometheus-data
---
apiVersion: v1
kind: Service
metadata:
  name: workmaite-prometheus
  namespace: skala3-finalproj-class2-team9
  labels:
    app: workmaite-prometheus
spec:
  type: ClusterIP
  selector:
    app: workmaite-prometheus
  ports:
    - name: http
      port: 9090
      targetPort: http
