apiVersion: apps/v1
kind: Deployment
metadata:
  name: workmaite-wlk
  namespace: skala3-finalproj-class2-team9
  labels:
    app: workmaite-wlk
spec:
  replicas: 1
  selector:
    matchLabels:
      app: workmaite-wlk
  template:
    metadata:
      labels:
        app: workmaite-wlk
    spec:
      containers:
        - name: wlk
          image: python:3.11-slim
          command: ["/bin/sh", "-c"]
          args:
            - |
              apt-get update && apt-get install -y --no-install-recommends ffmpeg curl && \
              pip install uv && \
              uv pip install --system "whisperlivekit[cpu,diarization-sortformer]" && \
              wlk --host 0.0.0.0 --port 9100 \
                  --model small \
                  --language ko \
                  --backend faster-whisper \
                  --diarization \
                  --diarization-backend sortformer
          ports:
            - containerPort: 9100
          env:
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: whisperx-secret
                  key: HF_TOKEN
          resources:
            requests:
              memory: "3Gi"
              cpu: "1"
            limits:
              memory: "6Gi"
              cpu: "2"
          readinessProbe:
            tcpSocket:
              port: 9100
            initialDelaySeconds: 300
            periodSeconds: 15
          livenessProbe:
            tcpSocket:
              port: 9100
            initialDelaySeconds: 360
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: workmaite-wlk
  namespace: skala3-finalproj-class2-team9
  labels:
    app: workmaite-wlk
spec:
  type: ClusterIP
  selector:
    app: workmaite-wlk
  ports:
    - port: 9100
      targetPort: 9100
