name: CI - Whisper

on:
  workflow_dispatch:  # 수동 실행만 허용 (자동 트리거 비활성화)

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GIT_TOKEN }}

      - name: Set image tag
        run: echo "IMAGE_TAG=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Login to Harbor
        uses: docker/login-action@v3
        with:
          registry: amdp-registry.skala-ai.com
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./backend/whisperx
          file: ./backend/whisperx/Dockerfile
          push: true
          tags: amdp-registry.skala-ai.com/skala26a-ai2/workmaite-wlk:${{ env.IMAGE_TAG }}

      - name: Update image tag in yaml
        run: |
          sed -i "s|workmaite-wlk:.*|workmaite-wlk:${{ env.IMAGE_TAG }}|g" \
            k8s/whisper.yaml

      - name: Commit and push updated yaml
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add k8s/whisper.yaml
          git commit -m "ci: update wlk image tag to ${{ env.IMAGE_TAG }}"
          git pull --rebase origin develop
          git push origin develop

      - name: Delete old Harbor images
        continue-on-error: true
        run: |
          REPO="workmaite-wlk"
          PROJECT="skala26a-ai2"
          REGISTRY="amdp-registry.skala-ai.com"
          DIGESTS=$(curl -s -u "${{ secrets.HARBOR_USERNAME }}:${{ secrets.HARBOR_PASSWORD }}" \
            "https://${REGISTRY}/api/v2.0/projects/${PROJECT}/repositories/${REPO}/artifacts?page_size=100&sort=-push_time" \
            | jq -r '.[3:] | .[].digest')
          for DIGEST in $DIGESTS; do
            ENCODED=$(echo "$DIGEST" | sed 's/:/%3A/g')
            curl -s -X DELETE -u "${{ secrets.HARBOR_USERNAME }}:${{ secrets.HARBOR_PASSWORD }}" \
              "https://${REGISTRY}/api/v2.0/projects/${PROJECT}/repositories/${REPO}/artifacts/${ENCODED}"
            echo "Deleted: $DIGEST"
          done
