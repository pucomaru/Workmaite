name: CI - Backend

on:
  push:
    branches:
      - develop         # develop 브랜치 push 시 실행
    paths:
      - 'backend/**'     # backend 폴더 변경 시에만 실행

jobs:
  build-and-push:
    runs-on: ubuntu-latest  # GitHub에서 제공하는 Ubuntu 환경에서 실행

    steps:
      # 1. 코드 체크아웃 (워크플로우가 레포 코드에 접근할 수 있게 함)
      - name: Checkout
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GIT_TOKEN }}  # yaml 업데이트 후 push할 때 필요

      # 2. 이미지 태그를 커밋 SHA 앞 7자리로 설정 (매 빌드마다 고유한 태그)
      - name: Set image tag
        run: echo "IMAGE_TAG=${GITHUB_SHA::7}" >> $GITHUB_ENV

      # 3. Harbor 로그인
      - name: Login to Harbor
        uses: docker/login-action@v4
        with:
          registry: amdp-registry.skala-ai.com
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      # 4. 이미지 빌드 & Harbor에 push
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ./backend/springboot   # springboot 폴더의 Dockerfile 사용 (빌드 컨텍스트 최소화)
          push: true
          tags: amdp-registry.skala-ai.com/skala26a-ai2/workmaite-backend:${{ env.IMAGE_TAG }}

      # 5. k8s yaml의 이미지 태그 업데이트 (ArgoCD가 이 변경을 감지해서 자동 배포)
      - name: Update image tag in yaml
        run: |
          sed -i "s|workmaite-backend:.*|workmaite-backend:${{ env.IMAGE_TAG }}|g" \
            k8s/springboot.yaml

      # 6. 변경된 yaml을 Git에 커밋 & push
      - name: Commit and push updated yaml
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add k8s/springboot.yaml
          git commit -m "ci: update backend image tag to ${{ env.IMAGE_TAG }}"
          git pull --rebase origin develop
          git push origin develop

      # 7. 오래된 Harbor 이미지 삭제 (최신 5개 유지)
      - name: Delete old Harbor images
        continue-on-error: true
        run: |
          REPO="workmaite-backend"
          PROJECT="skala26a-ai2"
          REGISTRY="amdp-registry.skala-ai.com"
          DIGESTS=$(curl -s -u "${{ secrets.HARBOR_USERNAME }}:${{ secrets.HARBOR_PASSWORD }}" \
            "https://${REGISTRY}/api/v2.0/projects/${PROJECT}/repositories/${REPO}/artifacts?page_size=100&sort=-push_time" \
            | jq -r '.[5:] | .[].digest')
          for DIGEST in $DIGESTS; do
            ENCODED=$(echo "$DIGEST" | sed 's/:/%3A/g')
            curl -s -X DELETE -u "${{ secrets.HARBOR_USERNAME }}:${{ secrets.HARBOR_PASSWORD }}" \
              "https://${REGISTRY}/api/v2.0/projects/${PROJECT}/repositories/${REPO}/artifacts/${ENCODED}"
            echo "Deleted: $DIGEST"
          done
