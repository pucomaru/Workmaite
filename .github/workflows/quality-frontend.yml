name: Quality - Frontend

# 배포(ci-frontend.yml) lint / test / build
on:
  pull_request:
    paths:
      - 'frontend/**'
  push:
    branches:
      - develop
    paths:
      - 'frontend/**'

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        # npm ci 대신 install — npm의 크로스플랫폼 optional-dependency lock 버그 회피
        # (Windows에서 생성한 lock이 linux의 @emnapi/@rolldown-wasm 해석과 어긋남)
        run: npm ci --no-fund

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
