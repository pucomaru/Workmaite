<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MeetmA!te - 회원가입</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --primary: #F5722A;
      --primary-light: #FEF0E7;
      --bg: #F4F5F7;
      --card: #FFFFFF;
      --text: #1A1A2E;
      --text-sub: #6B7280;
      --border: #E5E7EB;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 32px 16px;
    }
    .container {
      background: var(--card);
      border-radius: 16px;
      padding: 48px 40px;
      width: 440px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
    }
    .logo {
      display: flex; align-items: center; gap: 10px;
      justify-content: center; margin-bottom: 32px;
    }
    .logo-icon {
      width: 40px; height: 40px;
      background: var(--primary); border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      color: #fff; font-weight: 700; font-size: 18px;
    }
    .logo-name { font-size: 20px; font-weight: 700; color: var(--text); }
    h2 { font-size: 24px; font-weight: 700; color: var(--text); text-align: center; margin-bottom: 8px; }
    .subtitle { text-align: center; color: var(--text-sub); font-size: 14px; margin-bottom: 32px; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .form-group { margin-bottom: 18px; }
    label { display: block; font-size: 14px; font-weight: 500; color: var(--text); margin-bottom: 6px; }
    input[type="email"], input[type="password"], input[type="text"] {
      width: 100%; padding: 12px 14px;
      border: 1.5px solid var(--border);
      border-radius: 8px; font-size: 14px; color: var(--text);
      background: #fff; outline: none;
      transition: border-color 0.2s;
    }
    input:focus { border-color: var(--primary); }
    .password-hint { font-size: 12px; color: var(--text-sub); margin-top: 5px; }
    .strength-bar { display: flex; gap: 4px; margin-top: 8px; }
    .strength-bar span {
      height: 4px; flex: 1; border-radius: 2px; background: var(--border);
    }
    .strength-bar span.active { background: var(--primary); }
    .terms {
      display: flex; align-items: flex-start; gap: 8px;
      margin-bottom: 24px; font-size: 13px; color: var(--text-sub);
    }
    .terms input { margin-top: 2px; }
    .terms a { color: var(--primary); text-decoration: none; }
    .btn-primary {
      width: 100%; padding: 13px;
      background: var(--primary); color: #fff;
      border: none; border-radius: 8px;
      font-size: 15px; font-weight: 600; cursor: pointer;
    }
    .btn-primary:hover { background: #e0611a; }
    .login-link { text-align: center; font-size: 14px; color: var(--text-sub); margin-top: 20px; }
    .login-link a { color: var(--primary); text-decoration: none; font-weight: 600; }
    .step-indicator {
      display: flex; justify-content: center; gap: 8px; margin-bottom: 28px;
    }
    .step { width: 32px; height: 4px; border-radius: 2px; background: var(--border); }
    .step.active { background: var(--primary); }
    .workspace-select {
      display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 18px;
    }
    .ws-option {
      border: 2px solid var(--border); border-radius: 10px;
      padding: 16px 12px; text-align: center; cursor: pointer;
      transition: border-color 0.2s;
    }
    .ws-option:hover, .ws-option.selected { border-color: var(--primary); background: var(--primary-light); }
    .ws-option .icon { font-size: 24px; margin-bottom: 8px; }
    .ws-option .ws-name { font-size: 13px; font-weight: 600; color: var(--text); }
    .ws-option .ws-desc { font-size: 11px; color: var(--text-sub); margin-top: 2px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">
      <div class="logo-icon">M</div>
      <span class="logo-name">MeetmA!te</span>
    </div>
    <h2>새 계정 만들기</h2>
    <p class="subtitle">무료로 시작하세요</p>
    <div class="step-indicator">
      <div class="step active"></div>
      <div class="step active"></div>
      <div class="step"></div>
    </div>
    <form>
      <div class="form-row">
        <div class="form-group">
          <label for="firstname">이름</label>
          <input type="text" id="firstname" placeholder="홍">
        </div>
        <div class="form-group">
          <label for="lastname">성</label>
          <input type="text" id="lastname" placeholder="길동">
        </div>
      </div>
      <div class="form-group">
        <label for="email">이메일</label>
        <input type="email" id="email" placeholder="name@company.com">
      </div>
      <div class="form-group">
        <label>워크스페이스 용도</label>
        <div class="workspace-select">
          <div class="ws-option selected">
            <div class="icon">🏢</div>
            <div class="ws-name">업무용</div>
            <div class="ws-desc">팀 프로젝트 관리</div>
          </div>
          <div class="ws-option">
            <div class="icon">🎓</div>
            <div class="ws-name">학습용</div>
            <div class="ws-desc">스터디 & 강의</div>
          </div>
        </div>
      </div>
      <div class="form-group">
        <label for="password">비밀번호</label>
        <input type="password" id="password" placeholder="8자 이상 입력하세요">
        <div class="strength-bar">
          <span class="active"></span>
          <span class="active"></span>
          <span class="active"></span>
          <span></span>
        </div>
        <p class="password-hint">영문, 숫자, 특수문자 포함 8자 이상</p>
      </div>
      <div class="form-group">
        <label for="confirm">비밀번호 확인</label>
        <input type="password" id="confirm" placeholder="비밀번호를 다시 입력하세요">
      </div>
      <div class="terms">
        <input type="checkbox" id="terms">
        <label for="terms">
          <a href="#">서비스 이용약관</a> 및 <a href="#">개인정보처리방침</a>에 동의합니다
        </label>
      </div>
      <button type="submit" class="btn-primary" onclick="location.href='dashboard.html'; return false;">회원가입 완료</button>
    </form>
    <p class="login-link">이미 계정이 있으신가요? <a href="login.html">로그인</a></p>
  </div>
</body>
</html>
