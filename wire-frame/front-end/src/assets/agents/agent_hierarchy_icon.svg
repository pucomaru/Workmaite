  <circle cx="40" cy="14" r="3" fill="#7B80CC" opacity="0.9"/>
  <!-- connector lines -->
  <line x1="40" y1="25" x2="40" y2="36" stroke="#C0BFCF" stroke-width="1"/>
  <line x1="10" y1="36" x2="70" y2="36" stroke="#C0BFCF" stroke-width="1"/>
