<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MeetmA!te - 로그인</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --primary: #F5722A;
      --primary-light: #FEF0E7;
      --bg: #F4F5F7;
      --card: #FFFFFF;
      --text: #1A1A2E;
      --text-sub: #6B7280;
      --border: #E5E7EB;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .container {
      background: var(--card);
      border-radius: 16px;
      padding: 48px 40px;
      width: 400px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      justify-content: center;
      margin-bottom: 32px;
    }
    .logo-icon {
      width: 40px; height: 40px;
      background: var(--primary);
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      color: #fff; font-weight: 700; font-size: 18px;
    }
    .logo-name { font-size: 20px; font-weight: 700; color: var(--text); }
    h2 { font-size: 24px; font-weight: 700; color: var(--text); text-align: center; margin-bottom: 8px; }
    .subtitle { text-align: center; color: var(--text-sub); font-size: 14px; margin-bottom: 32px; }
    .form-group { margin-bottom: 20px; }
    label { display: block; font-size: 14px; font-weight: 500; color: var(--text); margin-bottom: 6px; }
    input[type="email"], input[type="password"], input[type="text"] {
      width: 100%; padding: 12px 14px;
      border: 1.5px solid var(--border);
      border-radius: 8px; font-size: 14px; color: var(--text);
      background: #fff; outline: none;
      transition: border-color 0.2s;
    }
    input:focus { border-color: var(--primary); }
    .row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
    .row label { margin: 0; display: flex; align-items: center; gap: 6px; font-weight: 400; cursor: pointer; }
    .forgot { font-size: 13px; color: var(--primary); text-decoration: none; }
    .btn-primary {
      width: 100%; padding: 13px;
      background: var(--primary); color: #fff;
      border: none; border-radius: 8px;
      font-size: 15px; font-weight: 600; cursor: pointer;
      transition: background 0.2s;
    }
    .btn-primary:hover { background: #e0611a; }
    .divider { display: flex; align-items: center; gap: 12px; margin: 24px 0; color: var(--text-sub); font-size: 13px; }
    .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: var(--border); }
    .btn-social {
      width: 100%; padding: 12px;
      background: #fff; border: 1.5px solid var(--border);
      border-radius: 8px; font-size: 14px; font-weight: 500;
      cursor: pointer; color: var(--text); margin-bottom: 12px;
      display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    .btn-social:hover { background: var(--bg); }
    .signup-link { text-align: center; font-size: 14px; color: var(--text-sub); margin-top: 24px; }
    .signup-link a { color: var(--primary); text-decoration: none; font-weight: 600; }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">
      <div class="logo-icon">M</div>
      <span class="logo-name">MeetmA!te</span>
    </div>
    <h2>다시 만나서 반가워요!</h2>
    <p class="subtitle">계정에 로그인하세요</p>
    <form>
      <div class="form-group">
        <label for="email">이메일</label>
        <input type="email" id="email" placeholder="name@example.com">
      </div>
      <div class="form-group">
        <label for="password">비밀번호</label>
        <input type="password" id="password" placeholder="비밀번호를 입력하세요">
      </div>
      <div class="row">
        <label><input type="checkbox"> 로그인 상태 유지</label>
        <a href="#" class="forgot">비밀번호 찾기</a>
      </div>
      <button type="submit" class="btn-primary" onclick="location.href='dashboard.html'; return false;">로그인</button>
    </form>

  </div>
</body>
</html>
