# Neo4j 5.x 설정 (선택용 오버라이드).
# 기본 docker-compose.yml은 이 파일을 마운트하지 않고 환경변수로 설정한다
# (프로덕션 k8s 배포와 동일한 방식).
# 직접 마운트하려면 compose 의 neo4j volumes 에 아래를 추가:
#   - ./docker/neo4j.conf:/conf/neo4j.conf
#
# 주의: 4.x 의 dbms.* 네임스페이스는 5.x 에서 server.* 로 변경됨.

# 메모리
server.memory.heap.initial_size=512m
server.memory.heap.max_size=1g
server.memory.pagecache.size=256m

# 인증
dbms.security.auth_enabled=true

# 리스닝 주소 (컨테이너 외부 접속 허용)
server.default_listen_address=0.0.0.0
server.bolt.listen_address=0.0.0.0:7687
server.http.listen_address=0.0.0.0:7474

# 디렉터리
server.directories.import=/var/lib/neo4j/import
