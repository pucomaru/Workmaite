# Workma!te AI Server
[project]
name = "workmaite-ai"
version = "0.1.0"
description = "Workma!te AI Server (FastAPI)"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.136.3",
    "uvicorn[standard]==0.49.0",
    "sqlalchemy==2.0.50",
    "psycopg2-binary==2.9.12",
    "python-jose[cryptography]==3.5.0",
    "python-multipart>=0.0.27",
    "aiofiles==25.1.0",
    "pydantic==2.13.4",
    "openai==2.41.1",
    "python-dotenv==1.2.2",
    "langchain==1.3.9",
    "langchain-core>=1.4.0",
    "langchain-openai>=1.3.2",
    "langsmith>=0.8.0",
    "langgraph>=1.1.3",
    "typing-extensions>=4.0",
    "pypdf>=6.13.3",
    "python-docx>=1.1.0",
    "tiktoken>=0.7.0",
    "langgraph-checkpoint-postgres==3.1.0",
    "boto3>=1.43.29",
    "markdown>=3.6",
    "weasyprint>=69.0",
    "prometheus-fastapi-instrumentator>=7.0.0",
    "prometheus-client>=0.20",
    "psycopg[binary]",
    "psycopg-pool>=3.2",
    "pyyaml>=6.0",
    "pdfplumber>=0.11",
    "openpyxl>=3.1",
    "neo4j>=6.2.0,<7",
    "websockets>=14,<16",
    "kiwipiepy>=0.23.2",
    "neo4j-graphrag>=1.18.0",
    "anyio>=4.13.0",
    "requests>=2.34.2",
]

[dependency-groups]
dev = [
    "ruff>=0.9",
    "mypy>=1.13",
    "deptry>=0.21",
    "pip-audit>=2.7",
    "types-pyyaml>=6.0.12.20260518",
    "types-markdown>=3.10.2.20260518",
]

[tool.ruff]
target-version = "py311"
extend-exclude = ["uploads"]

[tool.ruff.lint]
# 기본 규칙(E4/E7/E9, F) + 사소한 공백 경고(W)
extend-select = ["W"]

[tool.ruff.lint.per-file-ignores]
# load_dotenv()/환경설정을 모듈 임포트보다 먼저 실행해야 함
"main.py" = ["E402"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
# `param: T = None`을 Optional[T]로 해석
implicit_optional = true
check_untyped_defs = true
exclude = ['^uploads/', '^\.venv/']

[tool.deptry.per_rule_ignores]
# DEP002: 코드에서 직접 import하지 않지만 런타임에 필요한 의존성
#  - uvicorn: ASGI 서버(CLI 실행)  · psycopg2-binary/psycopg: SQLAlchemy/langgraph DB 드라이버
#  - python-multipart: FastAPI 폼 파싱  · langsmith: 트레이싱(env로 활성)  · langchain: 생태계 메타패키지
DEP002 = [
    "uvicorn",
    "psycopg2-binary",
    "psycopg",
    "python-multipart",
    "langsmith",
    "langchain",
    "aiofiles",
]
# DEP003: fastapi/boto3의 하위 패키지 — 부모를 따라가도록 별도 선언하지 않음
DEP003 = ["starlette", "botocore"]
