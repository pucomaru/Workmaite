# 스키마 검증 전용 프로파일 — 엔티티 매핑이 '실제(운영) 스키마'와 일치하는지 검사.
# 'test' 프로파일과 함께 활성화되어 datasource/jwt는 상속하고 ddl-auto만 validate로 덮어쓴다.
#
# ddl-auto: validate 는 READ-ONLY — Hibernate SchemaValidator가 INFORMATION_SCHEMA
# 메타데이터만 읽어 엔티티와 대조한다. CREATE/DROP/ALTER/INSERT/UPDATE/DELETE를 절대 하지 않음.
# 불일치(엔티티엔 있으나 DB엔 없는 컬럼 등 레거시) 발견 시 SchemaManagementException으로 실패하며
# 어떤 테이블/컬럼이 안 맞는지 메시지로 알려준다.
#
# 실행(운영 DB 대상): 운영 PostgreSQL을 localhost:5432로 port-forward 후
#   DB_URL=jdbc:postgresql://localhost:5432/<운영DB> DB_USER=<r/o계정> DB_PASSWORD=<pw> \
#     ./gradlew schemaValidate
spring:
  jpa:
    hibernate:
      ddl-auto: validate
