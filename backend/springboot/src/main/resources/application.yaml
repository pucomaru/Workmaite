spring:
  application:
    name: workmaite-server

  profiles:
    active: local

  datasource:
    # k8s 클러스터 내부: postgres-1-postgresql.postgres.svc.cluster.local:5432
    # 로컬 개발 시: kubectl port-forward svc/postgres-1-postgresql 5432:5432 -n postgres 후 localhost:5432
    # 비밀번호 등 시크릿은 환경변수로 주입 (로컬: DB_PASSWORD/REDIS_PASSWORD/JWT_SECRET export, k8s: backend-secret)
    url: ${DB_URL:jdbc:postgresql://localhost:5432/sk-team-9}
    username: ${DB_USER:team9}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 20000
      maximum-pool-size: 10

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_schema: public
    # SQL 로그는 로컬 디버깅 시에만: SHOW_SQL=true 환경변수로 활성화
    show-sql: ${SHOW_SQL:false}
    open-in-view: false

logging:
  # 로그 레벨을 LOG_LEVEL env로 제어 — FastAPI와 동일 변수를 쓰도록 통일 (미설정 시 INFO).
  # root까지 함께 적용하므로 DEBUG 지정 시 프레임워크 로그도 상세해진다.
  level:
    root: ${LOG_LEVEL:INFO}
    com.workmaite: ${LOG_LEVEL:INFO}

jwt:
  # FastAPI(python-jose HS256)와 동일한 시크릿 사용 (공유 JWT 인증) — 반드시 환경변수로 주입
  secret: ${JWT_SECRET:}
  access-token-expiration: 900000   # 15분 (ms)
  refresh-token-expiration: 1209600000 # 14일 (ms)

ai:
  # FastAPI AI 서버 URL
  url: http://localhost:8000

management:
  endpoints:
    web:
      exposure:
        include: prometheus,health,info
  endpoint:
    prometheus:
      enabled: true
    health:
      # 인증된 요청에만 컴포넌트 상세 노출 — 미인증(k8s probe 등)에는 status만 반환
      show-details: when-authorized
  metrics:
    export:
      prometheus:
        enabled: true

# ── API 문서 (springdoc-openapi / Swagger UI) ───────────────────────────────
# OpenAPI 3.1로 출력. Swagger UI: /swagger-ui.html , OpenAPI JSON: /v3/api-docs
# (SecurityConfig가 /swagger-ui/**, /v3/api-docs/** 를 permitAll로 허용 — OpenApiConfig가 JWT 스킴 정의)
springdoc:
  api-docs:
    version: openapi_3_1
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
    display-request-duration: true
    doc-expansion: none
  default-produces-media-type: application/json
