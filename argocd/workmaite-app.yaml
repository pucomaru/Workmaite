apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: workmaite-team9
  namespace: skala-argocd  # 교육팀이 운영하는 공용 ArgoCD 네임스페이스
spec:
  project: default  # ArgoCD 기본 프로젝트
  source:
    repoURL: https://github.com/als7928/Workmaite.git  # 배포 대상 GitHub 레포
    targetRevision: main  # 감시할 브랜치
    path: k8s  # 이 폴더 안의 yaml들을 EKS에 배포
  destination:
    server: https://kubernetes.default.svc  # 현재 클러스터 내부 API 서버
    namespace: skala3-finalproj-class2-team9  # 팀 네임스페이스
  syncPolicy:
    automated:
      prune: false   # k8s yaml 삭제해도 실제 Pod는 자동 삭제 안 함 (개발 중 안전하게 false)
      selfHeal: false  # kubectl 직접 수정 시 ArgoCD가 되돌리지 않음 (개발 중 false 권장)
    syncOptions:
      - CreateNamespace=false  # 네임스페이스 자동 생성 안 함 (교육환경에서 이미 제공)